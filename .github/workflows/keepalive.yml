name: Keep Supabase alive

on:
  schedule:
    # 每 6 小时执行一次：先做一次访问（保活），若发现项目被暂停则自动恢复
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase and restore if paused
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: https://fzgrxauidtcjxvpyvnjn.supabase.co
          PROJECT_REF: fzgrxauidtcjxvpyvnjn
          ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6Z3J4YXVpZHRjanh2cHl2bmpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MjY2OTIsImV4cCI6MjEwMTQwMjY5Mn0.QrDv5PvtfrZeAibUCe3zecAxc1H1K5w54S7LWKkkopc
        run: |
          status=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            "$SUPABASE_URL/rest/v1/family_data?select=id&limit=1")
          echo "supabase status: $status"
          echo "body: $(head -c 200 /tmp/body.txt)"

          if [ "$status" = "200" ]; then
            echo "项目正常，无需恢复。"
            exit 0
          fi

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "项目不可用，但仓库未配置 SUPABASE_ACCESS_TOKEN，无法自动恢复。"
            echo "请在 Supabase 生成 Access Token，并添加为仓库 Secret（名称：SUPABASE_ACCESS_TOKEN）。"
            exit 1
          fi

          echo "检测到项目不可用，尝试自动恢复…"
          restore=$(curl -s -o /tmp/restore.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/restore")
          echo "restore status: $restore"
          echo "restore body: $(head -c 300 /tmp/restore.txt)"
