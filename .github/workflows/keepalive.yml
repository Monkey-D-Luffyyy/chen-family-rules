name: Keep Supabase alive

on:
  schedule:
    # 每 2 天凌晨 3 点（UTC）执行一次，避免免费项目因闲置被自动暂停
    - cron: "0 3 */2 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -o /dev/null -w "supabase status: %{http_code}\n" \
