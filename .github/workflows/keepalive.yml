name: Keep Supabase alive

on:
  schedule:
    # 每小时自检一次：接口异常时按项目状态自动重启或恢复
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Check Supabase and recover if needed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: https://fzgrxauidtcjxvpyvnjn.supabase.co
          PROJECT_REF: fzgrxauidtcjxvpyvnjn
          ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6Z3J4YXVpZHRjanh2cHl2bmpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MjY2OTIsImV4cCI6MjEwMTQwMjY5Mn0.QrDv5PvtfrZeAibUCe3zecAxc1H1K5w54S7LWKkkopc
        run: |
          status=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            "$SUPABASE_URL/rest/v1/family_data?select=id&limit=1")
          echo "supabase status: $status"

          if [ "$status" = "200" ]; then
            echo "项目正常，无需处理。"
            exit 0
          fi

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "项目不可用，且仓库未配置 SUPABASE_ACCESS_TOKEN，无法自动修复。"
            exit 1
          fi

          project=$(curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF")
          pstatus=$(echo "$project" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
          echo "project status: $pstatus"

          case "$pstatus" in
            *INACTIVE*|*PAUSED*)
              echo "项目被暂停，执行恢复…"
              code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                "https://api.supabase.com/v1/projects/$PROJECT_REF/restore")
              ;;
            *COMING_UP*|*RESTORING*|*UPGRADING*|*PAUSING*)
              echo "项目正在启动或恢复中，等待下一次检查。"
              exit 0
              ;;
            *)
              echo "项目不健康，执行重启…"
              code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                "https://api.supabase.com/v1/projects/$PROJECT_REF/restart")
              ;;
          esac
          echo "recovery http status: $code"
          echo "recovery body: $(head -c 300 /tmp/resp.txt)"
